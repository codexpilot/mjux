name: mjux
description: Material app chrome and JSON-driven data workspaces for Flutter with JCore JUX integration.
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  jcore:
    git:
      url: https://github.com/codexpilot/jcore.git
      ref: main
      path: dart
  material_ui: ^1.11.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - example/fixtures/
